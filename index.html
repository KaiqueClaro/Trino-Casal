<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento de treino em dupla</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f1b2d;--mut:#6b778a;--line:#e3e8f0;--ac0:#2459e0;--ac1:#c93a78;--on:#fff;--ok:#12935a;--hi:#c2710c;--sh:0 1px 2px rgba(15,27,45,.05),0 8px 24px rgba(15,27,45,.06);--h1:#0c1b30;--h2:#1b4a8a;
--hf:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111c;--card:#121c2b;--ink:#e9eef6;--mut:#8b98ac;--line:#223045;--ac0:#7ba3ff;--ac1:#f48bb3;--on:#0a111c;--ok:#47c98a;--hi:#f0b04a;--sh:none}}
:root[data-theme="dark"]{--bg:#0a111c;--card:#121c2b;--ink:#e9eef6;--mut:#8b98ac;--line:#223045;--ac0:#7ba3ff;--ac1:#f48bb3;--on:#0a111c;--ok:#47c98a;--hi:#f0b04a;--sh:none}
:root{--ac:var(--ac0)}
:root[data-p="1"]{--ac:var(--ac1);--h1:#2a0f26;--h2:#8a2457}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 Inter,"Segoe UI",system-ui,sans-serif;padding-bottom:92px}
main{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font:700 22px var(--hf);letter-spacing:.02em}
.who{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--sh);border:1px solid var(--line)}
.pf{border:0;background:none;color:var(--mut);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf.on{background:var(--ac);color:var(--on)}
.hero{background:linear-gradient(140deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:var(--sh)}
.hero small{opacity:.75;font-size:13px}
.hero .n{font:700 54px/1 var(--hf);letter-spacing:.01em;margin:4px 0}
.hero .t{font-size:17px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px -4px 14px;padding:0 4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:7px 12px;font:inherit;font-size:13px}
.chip.on{background:#fff;color:#10213a;border-color:#fff;font-weight:600}
.go{width:100%;border:0;border-radius:14px;padding:14px;background:#fff;color:#10213a;font:600 16px Inter,sans-serif}
h2{font:700 20px var(--hf);letter-spacing:.02em;margin:22px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:14px}
.num{font:700 34px/1 var(--hf);letter-spacing:.01em}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:14px 16px;font:600 16px Inter,sans-serif;width:100%;cursor:pointer}
.btn.ghost{background:none;color:var(--mut);font-weight:500;padding:10px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;font-weight:600;font-size:14px;box-shadow:var(--sh)}
.ex{padding:14px 14px 10px}
.ex.done{border-color:var(--ok)}
.eh{display:flex;gap:10px;align-items:center}
.ix{flex:0 0 30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);display:grid;place-items:center;font:700 16px var(--hf)}
.done .ix{background:var(--ok);color:#fff}
.eh b{font-size:16px;font-weight:600;line-height:1.25}
.set{display:grid;grid-template-columns:44px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.set span{font:700 15px var(--hf);color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
.chk{height:42px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--mut);cursor:pointer}
.chk svg{width:20px;height:20px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:500}
.up{color:var(--ok)}.dn{color:var(--hi)}
.alert{background:color-mix(in srgb,var(--ac) 12%,var(--card));border:1px solid var(--ac);border-radius:16px;padding:14px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:6px;color:var(--mut);font:500 12px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav svg{width:24px;height:24px}
nav button.on{color:var(--ac);font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-t="treino"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Treino</button>
<button data-t="evo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Evolução</button>
<button data-t="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>Avaliação</button>
</nav>
<script>
const PLANS=[{rest:[90,120],tip:"Semanas 1-2: 2 séries por exercício, 3-4 repetições de reserva. Descanse 90-120 s nos principais.",days:{
A:{n:"Peito + tríceps",d:"Segunda",ex:[["Supino máquina",3,"10-12"],["Supino inclinado máquina",3,"10-12"],["Crucifixo máquina",2,"12-15"],["Tríceps corda",3,"12"],["Tríceps máquina",2,"12"]]},
B:{n:"Costas + bíceps",d:"Terça",ex:[["Puxada frontal",3,"10-12"],["Remada máquina com apoio",3,"10-12"],["Puxada neutra",2,"12"],["Rosca bíceps máquina",3,"12"],["Rosca direta na polia",2,"12"]]},
C:{n:"Pernas + ombros",d:"Quarta",ex:[["Leg press",4,"10-12"],["Cadeira extensora",3,"12-15"],["Flexora sentada",3,"12"],["Panturrilha sentada",3,"15"],["Desenvolvimento máquina",3,"10-12"],["Elevação lateral máquina",3,"12-15"],["Crucifixo inverso máquina",2,"12-15"]]},
D:{n:"Peito + tríceps (variação)",d:"Quinta",ex:[["Supino inclinado máquina",3,"10-12"],["Supino máquina",3,"10-12"],["Crossover na polia",2,"12-15"],["Tríceps máquina",3,"12"],["Tríceps corda",2,"12-15"]]},
E:{n:"Costas + bíceps + ombro",d:"Sexta",ex:[["Remada máquina com apoio",3,"10-12"],["Puxada neutra",3,"10-12"],["Puxada frontal",2,"12"],["Rosca direta na polia",3,"12"],["Rosca bíceps máquina",2,"12"],["Elevação lateral máquina",2,"12-15"]]}}},
{rest:[60,90],tip:"Primeiras 2 semanas: 2 séries por exercício, cargas leves e sem ir até a falha. Aquecimento de 5-10 minutos antes. Descanso de 60-90 s.",days:{
A:{n:"Inferior A: glúteos e quadríceps",d:"Segunda",ex:[["Cadeira extensora",3,"12"],["Leg press",3,"12"],["Cadeira abdutora",3,"15"],["Elevação pélvica na máquina",3,"12"],["Cadeira adutora",2,"15"]]},
B:{n:"Superior A: costas e bíceps",d:"Terça",ex:[["Remada com apoio no peito",3,"12"],["Puxada frontal",3,"12"],["Rosca bíceps na máquina ou polia",3,"12"],["Tríceps na polia",3,"12"],["Pallof press (cada lado)",2,"12"]]},
C:{n:"Inferior B: posterior e glúteos",d:"Quarta",ex:[["Mesa flexora",3,"12"],["Cadeira flexora",3,"12"],["Elevação pélvica na máquina",3,"12"],["Coice de glúteo na máquina (cada perna)",3,"12"],["Cadeira abdutora",3,"15"]]},
D:{n:"Superior B: peito, ombros e tríceps",d:"Quinta",ex:[["Supino na máquina",3,"12"],["Peck deck",3,"12"],["Elevação lateral na máquina",2,"12"],["Tríceps na polia",3,"12"],["Pallof press (cada lado)",2,"12"]]},
E:{n:"Inferior C: pernas completas",d:"Sexta",ex:[["Cadeira abdutora",3,"15"],["Cadeira extensora",3,"12"],["Mesa flexora",3,"12"],["Coice de glúteo na máquina (cada perna)",3,"12"],["Elevação pélvica na máquina",3,"12"]]}}}];
const ORD=["A","B","C","D","E"],KEY="ft_casal_v1";
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d.split("-").reverse().slice(0,2).join("/");
const dB=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const newP=n=>({name:n,start:today(),next:0,sessions:[],weights:[],checks:[],cur:null});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.ps)S={a:0,ps:[newP("Eu"),newP("Esposa")]};
let tab="treino",pick=null,tmStart=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const P=()=>S.ps[S.a],PL=()=>PLANS[S.a].days;
const OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

function lastFor(name){const ss=P().sessions;for(let i=ss.length-1;i>=0;i--){const w=PL()[ss[i].w];for(let k=0;k<w.ex.length;k++)if(w.ex[k][0]===name){const r=(ss[i].sets[k]||[]).filter(x=>x.ok);if(r.length)return r[r.length-1]}}return null}
function startWorkout(w){const sets={};PL()[w].ex.forEach((e,k)=>{const l=lastFor(e[0]);sets[k]=Array.from({length:e[1]},()=>({kg:l?l.kg:"",reps:l?l.reps:"",ok:false}))});P().cur={w,date:today(),sets};tmStart=0;save()}
function totals(c){let t=0,d=0;Object.values(c.sets).forEach(a=>a.forEach(s=>{t++;if(s.ok)d++}));return[d,t]}
function finish(){const p=P(),c=p.cur;p.sessions.push({w:c.w,date:c.date,sets:c.sets});p.next=(ORD.indexOf(c.w)+1)%5;p.cur=null;pick=null;save();render()}

function viewTreino(){
const p=P(),c=p.cur;
if(!c){const w=pick||ORD[p.next],pl=PL()[w],last=p.sessions[p.sessions.length-1],ns=pl.ex.reduce((a,e)=>a+e[1],0);
return`<div class="hero"><small>Próximo da sequência · ${pl.d}</small><div class="n">Treino ${w}</div><div class="t">${pl.n}</div><small>${pl.ex.length} exercícios · ${ns} séries</small>
<div class="chips">${ORD.map(k=>`<button class="chip ${k===w?"on":""}" data-pick="${k}">${k} · ${PL()[k].d}</button>`).join("")}</div>
<button class="go" id="go">Começar treino ${w}</button></div>
<div class="card"><b>Exercícios de hoje</b>${pl.ex.map((e,i)=>`<div class="row mut" style="display:flex;justify-content:space-between;margin-top:8px"><span>${i+1}. ${e[0]}</span><span>${e[1]} × ${e[2]}</span></div>`).join("")}</div>
<div class="card mut">${last?`Último treino: ${last.w} em ${fmt(last.date)}. Faltou um dia? Continue de onde parou, sem pular.`:"Carga e repetições vêm preenchidas com o último treino de cada exercício."}<div style="margin-top:6px">${PLANS[S.a].tip}</div></div>`}
const[d,t]=totals(c),pl=PL()[c.w];
let h=`<div class="timer"><span id="tm">Descanso: pronto</span><span>${d}/${t} séries</span></div>
<div class="card"><b>Treino ${c.w} · ${pl.n}</b><div class="bar"><i style="width:${t?d/t*100:0}%"></i></div></div>`;
pl.ex.forEach((e,k)=>{const ss=c.sets[k],all=ss.every(s=>s.ok);
h+=`<div class="card ex ${all?"done":""}"><div class="eh"><div class="ix">${all?OK.replace('<svg','<svg width="16" height="16"'):k+1}</div><div><b>${e[0]}</b><div class="mut">${e[1]} séries × ${e[2]} repetições</div></div></div>
${ss.map((s,i)=>`<div class="set"><span>Série ${i+1}</span><input type="number" inputmode="decimal" placeholder="kg" aria-label="Carga em kg" value="${esc(s.kg)}" data-k="${k}" data-i="${i}" data-f="kg"><input type="number" inputmode="numeric" placeholder="reps" aria-label="Repetições" value="${esc(s.reps)}" data-k="${k}" data-i="${i}" data-f="reps"><button class="chk ${s.ok?"on":""}" data-k="${k}" data-i="${i}" aria-label="Concluir série">${OK}</button></div>`).join("")}</div>`});
return h+`<button class="btn" id="fin">${d===t?"Finalizar treino":"Finalizar treino ("+d+"/"+t+" séries)"}</button><button class="btn ghost" id="cancel">Cancelar treino</button>`}

function chart(pts){if(pts.length<2)return`<div class="mut" style="margin-top:8px">Registre o peso em 2 ou mais datas para ver o gráfico.</div>`;
const W=320,H=130,x0=30,v=pts.map(p=>p.kg),mn=Math.min(...v)-1,mx=Math.max(...v)+1;
const X=i=>x0+(W-x0-10)*i/(pts.length-1),Y=y=>10+(H-28)*(1-(y-mn)/(mx-mn)),ln=pts.map((p,i)=>X(i)+","+Y(p.kg)).join(" ");
return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Peso ao longo do tempo"><polygon points="${X(0)},${H-18} ${ln} ${X(pts.length-1)},${H-18}" fill="var(--ac)" opacity=".12"/><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" points="${ln}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.kg)}" r="3.5" fill="var(--ac)"/>`).join("")}<text x="0" y="${Y(mx)+4}" font-size="10" fill="var(--mut)">${mx.toFixed(0)}</text><text x="0" y="${Y(mn)+4}" font-size="10" fill="var(--mut)">${mn.toFixed(0)}</text><text x="${x0}" y="${H-3}" font-size="10" fill="var(--mut)">${fmt(pts[0].d)}</text><text x="${W-10}" y="${H-3}" font-size="10" text-anchor="end" fill="var(--mut)">${fmt(pts[pts.length-1].d)}</text></svg>`}

function viewEvo(){const p=P(),ws=p.weights.slice().sort((a,b)=>a.d.localeCompare(b.d));
const n30=p.sessions.filter(s=>dB(s.date,today())<30).length,first=ws[0],lw=ws[ws.length-1],diff=first&&lw?lw.kg-first.kg:0;
let h=`<div class="grid2"><div class="card"><div class="mut">Treinos em 30 dias</div><div class="num">${n30}</div></div><div class="card"><div class="mut">Peso desde o início</div><div class="num ${diff<0?"up":""}">${first?(diff>0?"+":"")+diff.toFixed(1)+" kg":"–"}</div></div></div>
<div class="card"><b>Peso</b>${chart(ws)}<div style="display:flex;gap:8px;margin-top:10px"><input id="wkg" type="number" inputmode="decimal" placeholder="Peso de hoje (kg)" aria-label="Peso de hoje"><button class="btn" id="addw" style="width:auto">Salvar</button></div></div>
<h2>Cargas por exercício</h2><div class="card scroll"><table><tr><th>Exercício</th><th>Início</th><th>Agora</th></tr>`;
const m={};p.sessions.forEach(s=>PL()[s.w].ex.forEach((e,k)=>{(s.sets[k]||[]).filter(x=>x.ok&&+x.kg).forEach(x=>{const o=m[e[0]]||(m[e[0]]={f:+x.kg,l:0});o.l=+x.kg})}));
const nm=Object.keys(m);
h+=nm.length?nm.map(k=>{const o=m[k],g=o.l-o.f;return`<tr><td>${k}</td><td>${o.f} kg</td><td>${o.l} kg <span class="${g>0?"up":""}">${g>0?"(+"+g+")":""}</span></td></tr>`}).join(""):`<tr><td colspan="3" class="mut">Conclua séries com carga para acompanhar aqui.</td></tr>`;
h+=`</table></div><h2>Últimos treinos</h2>`;
h+=p.sessions.slice(-6).reverse().map(s=>{const[d,t]=totals(s);return`<div class="card" style="display:flex;justify-content:space-between"><span><b>Treino ${s.w}</b> · ${PL()[s.w].n}</span><span class="mut">${fmt(s.date)} · ${d}/${t}</span></div>`}).join("")||`<div class="card mut">Nenhum treino registrado ainda.</div>`;return h}

function viewAv(){const p=P(),lc=p.checks[p.checks.length-1],ref=lc?lc.date:p.start,dias=dB(ref,today());
const n30=p.sessions.filter(s=>dB(s.date,today())<30).length,adh=Math.min(100,Math.round(n30/20*100));
let h=dias>=30?`<div class="alert"><b>Hora da avaliação de 30 dias</b><div class="mut">Última referência: ${fmt(ref)} (${dias} dias atrás).</div></div>`:`<div class="card mut">Próxima avaliação em ${30-dias} dias (${fmt(new Date(new Date(ref).getTime()+30*864e5).toISOString().slice(0,10))}). Você pode fazer antes, se quiser.</div>`;
const sl=(id,t)=>`<label>${t}</label><select id="${id}">${[5,4,3,2,1].map(n=>`<option value="${n}">${n}</option>`).join("")}</select>`;
h+=`<div class="card"><b>Nova avaliação</b><div class="mut">Treinos nos últimos 30 dias: ${n30} (aderência ${adh}% de 20 treinos)</div>
<div class="grid2"><div><label>Peso (kg)</label><input id="a_p" type="number" inputmode="decimal"></div><div><label>Cintura (cm)</label><input id="a_c" type="number" inputmode="decimal"></div><div><label>Quadril (cm)</label><input id="a_q" type="number" inputmode="decimal"></div><div><label>Coxa (cm)</label><input id="a_b" type="number" inputmode="decimal"></div></div>
<div class="grid2"><div>${sl("a_e","Energia (1-5)")}</div><div>${sl("a_s","Sono (1-5)")}</div><div>${sl("a_f","Apetite (1-5)")}</div><div>${sl("a_r","Recuperação (1-5)")}</div></div>
<label>Dores ou desconfortos</label><textarea id="a_d" rows="2"></textarea><label>Como foi o mês? O que ajustar?</label><textarea id="a_n" rows="3"></textarea><button class="btn" id="savea" style="margin-top:12px">Salvar avaliação</button></div><h2>Histórico</h2>`;
h+=p.checks.slice().reverse().map((c,i,a)=>{const pr=a[i+1],dl=(k,u)=>pr&&c[k]&&pr[k]?` <span class="${c[k]<pr[k]?"up":"dn"}">(${c[k]-pr[k]>0?"+":""}${(c[k]-pr[k]).toFixed(1)}${u})</span>`:"";
return`<div class="card"><b>${fmt(c.date)}</b> · aderência ${c.adh}%<div class="mut">Peso ${c.p||"–"} kg${dl("p"," kg")} · Cintura ${c.c||"–"} cm${dl("c"," cm")} · Quadril ${c.q||"–"} cm${dl("q"," cm")} · Coxa ${c.b||"–"} cm</div><div class="mut">Energia ${c.e} · Sono ${c.s} · Apetite ${c.f} · Recuperação ${c.r}</div>${c.d?`<div>Desconfortos: ${esc(c.d)}</div>`:""}${c.n?`<div>${esc(c.n)}</div>`:""}</div>`}).join("")||`<div class="card mut">Sua primeira avaliação vira a base de comparação.</div>`;
h+=`<h2>Perfis</h2><div class="card"><div class="grid2"><div><label>Perfil 1 (treino do marido)</label><input id="n0" value="${esc(S.ps[0].name)}"></div><div><label>Perfil 2 (treino da esposa)</label><input id="n1" value="${esc(S.ps[1].name)}"></div></div><div class="mut" style="margin-top:10px">Os dados ficam salvos neste navegador, separados por perfil. Cada um deve usar sempre o mesmo celular.</div></div>`;return h}

function tick(){const el=document.getElementById("tm");if(!el||!tmStart)return;const s=Math.floor((Date.now()-tmStart)/1000),r=PLANS[S.a].rest;el.textContent="Descanso: "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+(s>=r[0]&&s<=r[1]+30?" · pode voltar":"")}
function render(){
document.documentElement.dataset.p=S.a;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
document.getElementById("app").innerHTML=`<div class="top"><div class="brand">TREINO EM DUPLA</div><div class="who">${S.ps.map((p,i)=>`<button class="pf ${i===S.a?"on":""}" data-pf="${i}">${esc(p.name)}</button>`).join("")}</div></div>`+(tab==="treino"?viewTreino():tab==="evo"?viewEvo():viewAv());
tick()}

document.addEventListener("click",e=>{
const t=e.target.closest("button");if(!t)return;const p=P();
if(t.dataset.t){tab=t.dataset.t;render();window.scrollTo(0,0);return}
if(t.dataset.pf!==undefined){S.a=+t.dataset.pf;pick=null;tmStart=0;save();render();return}
if(t.dataset.pick){pick=t.dataset.pick;render();return}
if(t.id==="go"){startWorkout(pick||ORD[p.next]);render();window.scrollTo(0,0);return}
if(t.classList.contains("chk")){const s=p.cur.sets[t.dataset.k][t.dataset.i];s.ok=!s.ok;if(s.ok)tmStart=Date.now();save();const y=window.scrollY;render();window.scrollTo(0,y);return}
if(t.id==="fin"){finish();return}
if(t.id==="cancel"){p.cur=null;save();render();return}
if(t.id==="addw"){const v=parseFloat(document.getElementById("wkg").value);if(v>0){p.weights=p.weights.filter(w=>w.d!==today());p.weights.push({d:today(),kg:v});save();render()}return}
if(t.id==="savea"){const g=id=>document.getElementById(id).value,n=id=>parseFloat(g(id))||null,n30=p.sessions.filter(s=>dB(s.date,today())<30).length;
const c={date:today(),p:n("a_p"),c:n("a_c"),q:n("a_q"),b:n("a_b"),e:+g("a_e"),s:+g("a_s"),f:+g("a_f"),r:+g("a_r"),d:g("a_d"),n:g("a_n"),adh:Math.min(100,Math.round(n30/20*100))};
p.checks.push(c);if(c.p){p.weights=p.weights.filter(w=>w.d!==today());p.weights.push({d:today(),kg:c.p})}save();render();window.scrollTo(0,0)}
});
document.addEventListener("input",e=>{const t=e.target;
if(t.dataset&&t.dataset.f){P().cur.sets[t.dataset.k][t.dataset.i][t.dataset.f]=t.value;save()}
if(t.id==="n0"||t.id==="n1"){S.ps[+t.id[1]].name=t.value||"Perfil";save()}});
document.addEventListener("change",e=>{if(e.target.id==="n0"||e.target.id==="n1")render()});
setInterval(tick,1000);render();
</script>
</body>
</html>
