<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#eceee6;--card:#fff;--ink:#0d0f0a;--mut:#667060;--line:#dde1d4;--ac:#c6ff1a;--on:#0b0b0d;--ok:#12803f;--hi:#d4560c;--hd:#0b0b0d;--fld:#f4f5ef;
--hf:"Barlow Condensed","Arial Narrow",Impact,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08080a;--card:#141417;--ink:#f3f6ec;--mut:#8c9486;--line:#25262b;--ok:#3ddc84;--hi:#ff7a3d;--hd:#000;--fld:#0d0d10}}
:root[data-theme="dark"]{--bg:#08080a;--card:#141417;--ink:#f3f6ec;--mut:#8c9486;--line:#25262b;--ok:#3ddc84;--hi:#ff7a3d;--hd:#000;--fld:#0d0d10}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,"Segoe UI",system-ui,sans-serif;padding-bottom:96px}
main{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{font:italic 800 26px var(--hf);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--ink);background:var(--ac);color:var(--on);padding:0 6px;margin-left:4px;border-radius:4px;transform:skewX(-8deg);display:inline-block}
.who{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.pf{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pf i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 9px}
.pf.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hero{position:relative;overflow:hidden;background:var(--hd);color:#fff;border-radius:20px;padding:20px;margin-bottom:12px;border:1px solid #26262b}
.hero:before{content:"";position:absolute;right:-40px;top:-20px;width:190px;height:260px;background:repeating-linear-gradient(115deg,var(--ac) 0 10px,transparent 10px 26px);opacity:.16}
.hero>*{position:relative}
.hero small{color:#aab2a2;font-size:13px}
.hero .n{font:italic 800 62px/.95 var(--hf);text-transform:uppercase;margin:6px 0 2px}
.hero .n em{color:var(--ac);font-style:inherit}
.hero .t{font-size:17px;font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px -4px;padding:0 4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid #3a3b41;background:#17171a;color:#e5e9de;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.go{width:100%;border:0;border-radius:12px;padding:15px;background:var(--ac);color:var(--on);font:italic 800 21px var(--hf);text-transform:uppercase;letter-spacing:.04em}
h2{font:italic 800 22px var(--hf);text-transform:uppercase;letter-spacing:.03em;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:5px;height:20px;background:var(--ac);transform:skewX(-12deg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.mut{color:var(--mut);font-size:14px}
.num{font:italic 800 36px/1 var(--hf)}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:13px 16px;font:italic 800 18px var(--hf);text-transform:uppercase;letter-spacing:.04em;width:100%;cursor:pointer}
.btn.sec{background:var(--fld);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:15px}
.btn.dng{background:transparent;color:var(--hi);border:1px solid var(--hi)}
.btn.arm{background:var(--hi);color:#fff}
.ghost{background:none;border:0;color:var(--mut);padding:10px;width:100%;font:inherit;cursor:pointer}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;background:var(--ac);color:var(--on);border-radius:12px;padding:9px 14px;margin-bottom:12px;display:flex;justify-content:space-between;font:italic 800 18px var(--hf);text-transform:uppercase}
.ex.done{border-color:var(--ok)}
.eh{display:flex;gap:10px;align-items:center}
.ix{flex:0 0 32px;height:32px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:italic 800 17px var(--hf)}
.done .ix{background:var(--ok);color:#fff}
.eh b{font-weight:600;line-height:1.25}
.set{display:grid;grid-template-columns:48px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.set span{font:italic 700 15px var(--hf);color:var(--mut);text-transform:uppercase}
input,select,textarea{font:inherit;color:var(--ink);background:var(--fld);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--fld);color:var(--mut);cursor:pointer}
.chk svg{width:20px;height:20px}
.chk.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r{display:flex;gap:8px;align-items:center}.sb{justify-content:space-between}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:500}
.up{color:var(--ok)}.dn{color:var(--hi)}
.alert{background:var(--ink);color:var(--bg);border-left:6px solid var(--ac);border-radius:12px;padding:12px 14px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--hd);border-top:1px solid #26262b;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:6px 2px;color:#8c9486;font:600 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav svg{width:23px;height:23px}
nav button.on{color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500;font-size:13px}tr:last-child td{border:0}
.dots{display:flex;gap:5px;margin-top:10px}.dots i{flex:1;height:26px;border-radius:6px;background:var(--line)}.dots i.on{background:var(--ac)}
.sw{display:flex;gap:8px;margin-top:6px}.sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c)}.sw button.on{border-color:var(--ink)}
.xr{display:grid;grid-template-columns:1fr 54px 64px 38px;gap:6px;margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nv"></nav>
<script>
const uid=()=>Math.random().toString(36).slice(2,8);
const T=(n,d,s)=>({id:uid(),n,d,ex:s.split("|").map(x=>{const[a,b,c]=x.split(";");return[a,+b,c]})});

function lastSets(n){const ss=P().sessions;for(let i=ss.length-1;i>=0;i--){const k=ss[i].ex.findIndex(e=>e[0]===n);if(k>=0){const r=(ss[i].sets[k]||[]).filter(x=>x.ok);if(r.length)return r}}return[]}
function lastFor(n){const r=lastSets(n);return r.length?r[r.length-1]:null}
function sug(e){const r=lastSets(e[0]),nm=String(e[2]).match(/\d+/g)||[],hi=+nm[nm.length-1]||0,lo=+nm[0]||0;if(!r.length||!hi)return null;const kg=Math.max(...r.map(x=>+x.kg||0));if(kg>0&&r.length>=e[1]&&r.every(x=>+x.reps>=hi)){return{kg:Math.max(kg+.5,Math.round(kg*1.05*2)/2),from:kg,reps:lo}}return null}
function cardioHtml(){const p=P(),wk=p.cardio.filter(c=>dB(c.d,today())<7).reduce((a,c)=>a+c.min,0);
return`<h2>Cardio</h2><div class="card"><div class="mut">${wk} min nos últimos 7 dias</div><div class="r" style="margin-top:10px"><select id="c_t" aria-label="Tipo">${["Esteira","Bicicleta","Elíptico","Caminhada","Outro"].map(x=>`<option>${x}</option>`).join("")}</select><input id="c_m" type="number" inputmode="numeric" placeholder="min" aria-label="Minutos" style="max-width:90px"><button class="btn sm" data-a="addc">Salvar</button></div>${p.cardio.slice(-3).reverse().map(c=>{const i=p.cardio.indexOf(c);return`<div class="r sb" style="margin-top:8px"><span class="mut">${fmt(c.d)} · ${esc(c.t)} · ${c.min} min</span>${delBtn("c:"+i,"Remover")}</div>`}).join("")}</div>`}
function medHtml(){const p=P(),l=p.meds[p.meds.length-1],fx=["Nenhum","Náusea leve","Náusea forte","Enjoo ou refluxo","Intestino preso","Cansaço","Outro"];
return`<h2>Medicação</h2><div class="card">${l?`<div class="mut">Última aplicação: ${fmt(l.d)} (há ${dB(l.d,today())} dias)</div>`:'<div class="mut">Nenhuma aplicação registrada.</div>'}<div class="g2"><div><label>Medicamento</label><input id="m_n" value="${esc(l?l.m:"")}"></div><div><label>Dose (conforme prescrição)</label><input id="m_o" value="${esc(l?l.dose:"")}"></div></div><div class="g2"><div><label>Data</label><input id="m_d" type="date" value="${today()}"></div><div><label>Efeito observado</label><select id="m_f">${fx.map(x=>`<option>${x}</option>`).join("")}</select></div></div><button class="btn" data-a="addm" style="margin-top:12px">Registrar aplicação</button>${p.meds.slice(-4).reverse().map(m=>{const i=p.meds.indexOf(m);return`<div class="r sb" style="margin-top:10px"><span class="mut">${fmt(m.d)} · ${esc(m.m||"–")} ${esc(m.dose||"")} · ${esc(m.fx)}</span>${delBtn("m:"+i,"Remover")}</div>`}).join("")}<div class="mut" style="margin-top:10px;font-size:13px">Registro pessoal. Dose e ajustes são decididos com o médico.</div></div>`}
const dl=()=>{const p=P(),b=p.dl||(p.sessions[0]&&p.sessions[0].date);return !!b&&dB(b,today())>=49&&p.sessions.length>=12};
function startW(i){const p=P(),t=p.plan[i];if(!t)return;const sets={},sg={};t.ex.forEach((e,k)=>{const l=lastFor(e[0]),u=sug(e);if(u)sg[k]=u.from;sets[k]=Array.from({length:e[1]},()=>({kg:u?u.kg:(l?l.kg:""),reps:u?u.reps:(l?l.reps:""),ok:false}))});p.cur={id:t.id,n:t.n,date:today(),ex:clone(t.ex),sets,sg};tmStart=0;save()}
const totals=c=>{let t=0,d=0;Object.values(c.sets).forEach(a=>a.forEach(s=>{t++;if(s.ok)d++}));return[d,t]};
function best(ss,upto){const m={};ss.slice(0,upto).forEach(s=>s.ex.forEach((e,k)=>(s.sets[k]||[]).filter(x=>x.ok&&+x.kg>0&&+x.reps>0).forEach(x=>{const v=e1(+x.kg,+x.reps),o=m[e[0]];if(!o)m[e[0]]={f:v,b:v,kg:+x.kg,r:+x.reps};else if(v>o.b){o.b=v;o.kg=+x.kg;o.r=+x.reps}})));return m}
function finish(){const p=P(),c=p.cur,pr=best(p.sessions,p.sessions.length);p.sessions.push({id:c.id,n:c.n,date:c.date,ex:c.ex,sets:c.sets});
const nw=best(p.sessions,p.sessions.length),prs=Object.keys(nw).filter(k=>pr[k]&&nw[k].b>pr[k].b+.01);
notice=prs.length?"Novo recorde: "+prs.slice(0,3).join(", ")+"!":"Treino salvo. Bom trabalho!";
const i=p.plan.findIndex(t=>t.id===c.id);if(i>=0)p.next=(i+1)%p.plan.length;p.cur=null;pick=null;save();render()}
const hab=()=>{const p=P();return p.hab[today()]||(p.hab[today()]={w:0,p:0,s:0})};

${ss.map((s,i)=>`<div class="set"><span>Série ${i+1}</span><input type="number" inputmode="decimal" placeholder="kg" aria-label="Carga em kg" value="${esc(s.kg)}" data-k="${k}" data-i="${i}" data-f="kg"><input type="number" inputmode="numeric" placeholder="reps" aria-label="Repetições" value="${esc(s.reps)}" data-k="${k}" data-i="${i}" data-f="reps"><button class="chk ${s.ok?"on":""}" data-a="chk" data-k="${k}" data-i="${i}" aria-label="Concluir série">${OK}</button></div>`).join("")}</div>`});
return h+`<button class="btn" data-a="fin">${d===t?"Finalizar treino":"Finalizar ("+d+"/"+t+")"}</button><button class="ghost" data-a="cancel">Cancelar treino</button>`}

function chart(pts){if(pts.length<2)return`<div class="mut" style="margin-top:8px">Registre o peso em 2 ou mais datas para ver o gráfico.</div>`;
const W=320,H=130,x0=30,v=pts.map(p=>p.kg),mn=Math.min(...v)-1,mx=Math.max(...v)+1,X=i=>x0+(W-x0-10)*i/(pts.length-1),Y=y=>10+(H-28)*(1-(y-mn)/(mx-mn)),ln=pts.map((p,i)=>X(i)+","+Y(p.kg)).join(" ");
return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Peso ao longo do tempo"><polygon points="${X(0)},${H-18} ${ln} ${X(pts.length-1)},${H-18}" fill="var(--ac)" opacity=".18"/><polyline fill="none" stroke="var(--ac)" stroke-width="3" stroke-linejoin="round" points="${ln}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.kg)}" r="3.5" fill="var(--ac)"/>`).join("")}<g font-size="10" fill="var(--mut)"><text x="0" y="${Y(mx)+4}">${mx.toFixed(0)}</text><text x="0" y="${Y(mn)+4}">${mn.toFixed(0)}</text><text x="${x0}" y="${H-3}">${fmt(pts[0].d)}</text><text x="${W-10}" y="${H-3}" text-anchor="end">${fmt(pts[pts.length-1].d)}</text></g></svg>`}
const delBtn=(k,l="Excluir")=>`<button class="btn sm dng ${arm===k?"arm":""}" data-a="del" data-v="${k}">${arm===k?"Confirmar?":l}</button>`;

return`<div class="card"><b>${fmt(c.date)}</b> · aderência ${c.adh}%<div class="mut">Peso ${c.p||"–"} kg${dl("p"," kg")} · Cintura ${c.c||"–"} cm${dl("c"," cm")} · Quadril ${c.q||"–"} cm${dl("q"," cm")} · Braço/coxa ${c.b||"–"} cm</div><div class="mut">Energia ${c.e} · Sono ${c.s} · Apetite ${c.f} · Recuperação ${c.r}</div>${c.d?`<div>Desconfortos: ${esc(c.d)}</div>`:""}${c.n?`<div>${esc(c.n)}</div>`:""}<div class="r" style="margin-top:10px"><button class="btn sm sec" data-a="edita" data-v="${i}">Editar</button>${delBtn("a:"+i)}</div></div>`}).join("")||'<div class="card mut">Sua primeira avaliação vira a base de comparação.</div>';return h}

function viewSet(){const p=P();
if(eda!==null&&p.plan[eda]){const t=p.plan[eda];return`<h2>Editar treino</h2><div class="card"><label>Nome do treino</label><input data-e="n" value="${esc(t.n)}"><label>Dia ou rótulo (ex.: Segunda)</label><input data-e="d" value="${esc(t.d)}">
<label>Exercícios (nome, séries, repetições)</label>${t.ex.map((e,i)=>`<div class="xr"><input data-x="${i}:0" value="${esc(e[0])}" aria-label="Nome"><input data-x="${i}:1" type="number" value="${e[1]}" aria-label="Séries"><input data-x="${i}:2" value="${esc(e[2])}" aria-label="Repetições"><button class="chk" data-a="delx" data-v="${i}" aria-label="Remover exercício">✕</button></div>`).join("")}
<button class="btn sec" data-a="addx" style="margin-top:10px">+ Exercício</button></div><div class="r">${delBtn("t:"+eda,"Excluir treino")}<button class="btn" data-a="edclose">Concluir</button></div>`}
const pc=S.ps.map((q,i)=>`<div class="card"><div class="r"><input data-pn="${i}" value="${esc(q.name)}" aria-label="Nome"><div style="flex:0 0 78px"><input data-pr="${i}" type="number" value="${q.rest}" aria-label="Descanso em segundos" title="Descanso (s)"></div>${S.ps.length>1?delBtn("p:"+i,"Remover"):""}</div><div class="sw">${COL.map((c,k)=>`<button style="--c:${c}" class="${q.c===k?"on":""}" data-a="col" data-v="${i}:${k}" aria-label="Cor"></button>`).join("")}</div><div class="mut" style="margin-top:6px">Descanso entre séries em segundos (campo à direita do nome).</div></div>`).join("");
return`<h2>Treinos de ${esc(p.name)}</h2>${p.plan.map((t,i)=>`<div class="card r sb"><span><b>${i+1}. ${esc(t.n)}</b><div class="mut">${esc(t.d)} · ${t.ex.length} exercícios</div></span><span class="r"><button class="chk" style="width:36px;height:36px" data-a="mv" data-v="${i}:-1" aria-label="Subir">↑</button><button class="chk" style="width:36px;height:36px" data-a="mv" data-v="${i}:1" aria-label="Descer">↓</button><button class="btn sm sec" data-a="ed" data-v="${i}">Editar</button></span></div>`).join("")}<button class="btn" data-a="newt">+ Novo treino</button>
<h2>Pessoas</h2>${pc}<div class="r"><button class="btn sec" data-a="addp" data-v="0">+ Pessoa (vazio)</button><button class="btn sec" data-a="addp" data-v="1">+ Copiar treinos</button></div>
<h2>Backup</h2><div class="card"><div class="mut">Os dados ficam só neste navegador. Gere um backup e guarde o texto (notas ou mensagem). Para restaurar, cole e toque em Restaurar.</div><textarea id="bk" rows="4" style="margin-top:8px">${esc(bk)}</textarea><div class="r" style="margin-top:8px"><button class="btn sec" data-a="bk">Gerar backup</button><button class="btn sec" data-a="rs">Restaurar</button></div></div>`}

function tick(){const el=document.getElementById("tm");if(!el||!tmStart)return;const s=Math.floor((Date.now()-tmStart)/1000),r=P().rest;el.textContent="Descanso: "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+(s>=r?" · pode voltar":"")}
function render(){const p=P();document.documentElement.style.setProperty("--ac",COL[p.c]||COL[0]);
document.getElementById("nv").innerHTML=Object.keys(TN).map(k=>`<button class="${k===tab?"on":""}" data-t="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${TN[k]}</button>`).join("");
document.getElementById("app").innerHTML=`<div class="top"><div class="brand">Duo<b>Gym</b></div><div class="who">${S.ps.map((q,i)=>`<button class="pf ${i===S.a?"on":""}" style="--c:${COL[q.c]}" data-a="pf" data-v="${i}"><i></i>${esc(q.name)}</button>`).join("")}</div></div>`+({treino:viewTreino,dia:viewDia,evo:viewEvo,av:viewAv,set:viewSet}[tab])();tick()}
const go=()=>{save();const y=window.scrollY;render();window.scrollTo(0,y)};
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const p=P(),a=t.dataset.a,v=t.dataset.v;
if(t.dataset.t){tab=t.dataset.t;ed=null;notice="";render();window.scrollTo(0,0);return}
const[v0,v1]=(v||"").split(":");
switch(a){
case"pf":S.a=+v;pick=null;tmStart=0;ed=null;eda=null;save();render();break;
case"pick":pick=+v;render();break;
case"go":startW(Math.min(pick??p.next,p.plan.length-1));notice="";render();window.scrollTo(0,0);break;
case"chk":{const s=p.cur.sets[t.dataset.k][t.dataset.i];s.ok=!s.ok;if(s.ok)tmStart=Date.now();go();break}
case"fin":finish();window.scrollTo(0,0);break;
case"cancel":p.cur=null;save();render();break;
case"addw":{const x=parseFloat(document.getElementById("wkg").value);if(x>0){p.weights=p.weights.filter(w=>w.d!==today());p.weights.push({d:today(),kg:x});go()}break}
case"hab":{const h=hab();h[v0]=Math.max(0,h[v0]+ +v1);go();break}
case"savea":{const g=id=>document.getElementById(id).value,n=id=>parseFloat(g(id))||null,dt=g("a_t")||today(),n30=p.sessions.filter(s=>{const x=dB(s.date,dt);return x>=0&&x<30}).length;
const c={date:dt,p:n("a_p"),c:n("a_c"),q:n("a_q"),b:n("a_b"),e:+g("a_e"),s:+g("a_s"),f:+g("a_f"),r:+g("a_r"),d:g("a_d"),n:g("a_n"),adh:Math.min(100,Math.round(n30/20*100))};
if(ed!==null)p.checks[ed]=c;else p.checks.push(c);p.checks.sort((x,y)=>x.date.localeCompare(y.date));if(c.p){p.weights=p.weights.filter(w=>w.d!==dt);p.weights.push({d:dt,kg:c.p})}ed=null;save();render();window.scrollTo(0,0);break}
case"addc":{const m=parseFloat(document.getElementById("c_m").value);if(m>0){p.cardio.push({d:today(),t:document.getElementById("c_t").value,min:m});go()}break}
case"addm":{const g=id=>document.getElementById(id).value;p.meds.push({d:g("m_d")||today(),m:g("m_n"),dose:g("m_o"),fx:g("m_f")});p.meds.sort((a,b)=>a.d.localeCompare(b.d));go();break}
case"dl":p.dl=today();save();render();break;
case"edita":ed=+v;render();window.scrollTo(0,0);break;
case"cancela":ed=null;render();break;
case"del":{if(arm!==v){arm=v;render();setTimeout(()=>{if(arm===v){arm="";render()}},4000);break}arm="";
if(v0==="a")p.checks.splice(+v1,1);if(v0==="s")p.sessions.splice(+v1,1);if(v0==="c")p.cardio.splice(+v1,1);if(v0==="m")p.meds.splice(+v1,1);
if(v0==="t"){p.plan.splice(+v1,1);eda=null;p.next=0}
if(v0==="p"){S.ps.splice(+v1,1);S.a=0}go();break}
case"ed":eda=+v;render();window.scrollTo(0,0);break;
case"edclose":eda=null;render();break;
case"newt":p.plan.push(T("Novo treino","","Exercício;3;12"));eda=p.plan.length-1;save();render();window.scrollTo(0,0);break;
case"mv":{const i=+v0,j=i+ +v1;if(j>=0&&j<p.plan.length){[p.plan[i],p.plan[j]]=[p.plan[j],p.plan[i]];p.next=0;go()}break}
case"addx":p.plan[eda].ex.push(["Novo exercício",3,"12"]);go();break;
case"delx":p.plan[eda].ex.splice(+v,1);go();break;
case"addp":{const q=newP("Pessoa "+(S.ps.length+1),S.ps.length%COL.length,v==="1"?clonePlan(p.plan):[T("Treino A","","Exercício;3;12")]);S.ps.push(q);S.a=S.ps.length-1;eda=null;save();render();break}
case"col":p.c=p.c;S.ps[+v0].c=+v1;go();break;
case"bk":bk=JSON.stringify(S);document.getElementById("bk").value=bk;try{navigator.clipboard.writeText(bk)}catch(x){}break;
case"rs":{try{const o=JSON.parse(document.getElementById("bk").value);if(o&&o.ps&&o.ps.length){S=o;S.a=0;norm();save();render()}}catch(x){alert("Backup inválido.")}break}
}});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset,p=P();
if(d.f){p.cur.sets[d.k][d.i][d.f]=t.value;save()}
if(d.pn!==undefined){S.ps[+d.pn].name=t.value||"Pessoa";save()}
if(d.pr!==undefined){S.ps[+d.pr].rest=+t.value||90;save()}
if(d.e){p.plan[eda][d.e]=t.value;save()}
if(d.x){const[i,f]=d.x.split(":");p.plan[eda].ex[+i][+f]=f==="1"?(+t.value||1):t.value;save()}
if(d.g){p.goal[d.g]=+t.value||1;save()}
if(d.hs){hab().s=+t.value||0;save()}
if(d.nt!==undefined){p.notes[p.cur.ex[+d.nt][0]]=t.value;save()}});
document.addEventListener("change",e=>{if(e.target.dataset.pn!==undefined||e.target.dataset.g||e.target.dataset.hs)render()});
setInterval(tick,1000);render();
</script>
</body>
</html>
